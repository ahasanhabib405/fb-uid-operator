<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB UID Operator</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
        body{background:#0a0a0f;padding:15px;color:#fff}
        .container{max-width:800px;margin:auto}
        
        .header{text-align:center;padding:20px 0;border-bottom:1px solid #1a1a2e}
        .header h1{color:#1877f2;font-size:24px}
        .header h1 span{background:#1877f2;color:#fff;padding:4px 15px;border-radius:20px;font-size:16px}
        .header p{color:#888;font-size:13px;margin-top:5px}
        
        .uid-display-box{background:#16162a;border-radius:12px;padding:12px 18px;margin:12px 0;border:2px solid #1877f2;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
        .uid-display-box input{flex:1;background:transparent;border:none;color:#1877f2;font-size:18px;font-family:monospace;outline:none;min-width:150px}
        .uid-display-box input::placeholder{color:#444;font-size:14px}
        .uid-display-box .btn-sm{background:#1877f2;color:#fff;border:none;padding:8px 18px;border-radius:20px;cursor:pointer;font-weight:bold}
        .uid-display-box .btn-sm:hover{background:#0d65d9}
        .uid-display-box .btn-sm.outline{background:transparent;border:1px solid #2a2a4a;color:#888}
        .uid-display-box .btn-sm.outline:hover{background:#2a2a4a;color:#fff}
        
        .search-box{background:#16162a;border-radius:30px;padding:12px 20px;margin:12px 0;border:1px solid #2a2a4a}
        .search-box input{background:transparent;border:none;color:#fff;width:100%;font-size:15px;outline:none}
        .search-box input::placeholder{color:#555}
        
        .upload-area{background:#16162a;border-radius:16px;padding:20px;margin:12px 0;border:1px dashed #2a2a4a;text-align:center}
        .upload-area input{color:#fff;padding:8px;width:100%}
        .btn-group{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
        
        .btn{background:#1877f2;color:#fff;border:none;padding:10px 25px;border-radius:25px;cursor:pointer;font-weight:bold;transition:0.3s}
        .btn:hover{background:#0d65d9;transform:scale(1.02)}
        .btn-green{background:#25a35a}
        .btn-green:hover{background:#1e8a4b}
        .btn-red{background:#e74c3c}
        .btn-red:hover{background:#c0392b}
        .btn-outline{background:transparent;border:1px solid #2a2a4a;color:#aaa}
        .btn-outline:hover{background:#2a2a4a;color:#fff}
        .btn-copy{background:#2a2a4a;color:#fff;border:none;padding:4px 12px;border-radius:12px;cursor:pointer;font-size:11px}
        .btn-copy:hover{background:#1877f2}
        
        .stats{display:flex;justify-content:space-between;background:#16162a;border-radius:12px;padding:12px 20px;margin:10px 0;border:1px solid #1a1a2e;flex-wrap:wrap}
        .stats span{color:#888;font-size:13px}
        .stats strong{color:#fff;font-size:16px}
        
        /* UID Cards */
        .uid-card{background:#16162a;border-radius:12px;padding:15px;margin:10px 0;border-left:4px solid #1877f2;transition:0.3s}
        .uid-card:hover{background:#1e1e3a;transform:translateX(5px)}
        .uid-card .card-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
        .uid-card .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1877f2,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;color:#fff;flex-shrink:0}
        .uid-card .card-name{flex:1;cursor:pointer}
        .uid-card .card-name .name{font-size:16px;font-weight:bold;color:#fff}
        .uid-card .card-name .uid{font-size:13px;color:#1877f2;font-family:monospace}
        .uid-card .card-name .uid:hover{text-decoration:underline}
        
        .uid-card .card-body{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;padding:8px 0;border-top:1px solid #1a1a2e}
        .uid-card .card-body .field{background:#0a0a0f;padding:4px 12px;border-radius:12px;display:flex;align-items:center;gap:6px;font-size:13px}
        .uid-card .card-body .field .label{color:#888}
        .uid-card .card-body .field .value{color:#fff}
        .uid-card .card-body .field .copy-btn{background:transparent;border:none;color:#555;cursor:pointer;font-size:14px;padding:0 4px}
        .uid-card .card-body .field .copy-btn:hover{color:#1877f2}
        
        .uid-card .card-status{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid #1a1a2e}
        .uid-card .card-status .status{font-size:12px;padding:2px 14px;border-radius:20px}
        .uid-card .card-status .status.imported{background:#0a2a1a;color:#25a35a}
        .uid-card .card-status .status.pending{background:#2a1a0a;color:#f0a030}
        .uid-card .card-actions{display:flex;gap:6px}
        
        .click-hint{color:#555;font-size:11px;text-align:center;margin-top:4px}
        
        .modal{display:none;position:fixed;z-index:999;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px)}
        .modal-content{background:#16162a;margin:8% auto;padding:0;width:92%;max-width:500px;border-radius:16px;border:1px solid #2a2a4a}
        .modal-header{padding:18px 22px;border-bottom:1px solid #1a1a2e;display:flex;justify-content:space-between;align-items:center}
        .modal-header h2{color:#1877f2;font-size:20px}
        .modal-header .close{font-size:28px;cursor:pointer;color:#555;transition:0.3s}
        .modal-header .close:hover{color:#fff}
        .modal-body{padding:22px;max-height:400px;overflow-y:auto}
        .modal-body .detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a2e}
        .modal-body .detail-row .label{color:#888}
        .modal-body .detail-row .value{color:#fff;font-weight:bold}
        .modal-footer{padding:15px 22px;border-top:1px solid #1a1a2e;display:flex;gap:10px;justify-content:flex-end}
        
        .progress-container{width:100%;background:#1a1a2e;border-radius:30px;height:8px;margin:10px 0;overflow:hidden}
        .progress-bar{height:100%;background:linear-gradient(90deg,#1877f2,#25a35a);border-radius:30px;transition:width 0.3s;width:0%}
        
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#25a35a;color:#fff;padding:12px 25px;border-radius:30px;font-size:14px;display:none;z-index:9999}
        .toast.error{background:#e74c3c}
        
        @media(max-width:600px){.uid-card .card-body{flex-direction:column}}
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>FB UID <span>Operator</span></h1>
        <p>Facebook UID & পাসওয়ার্ড ম্যানেজার</p>
    </div>
    
    <!-- UID ডিসপ্লে বক্স -->
    <div class="uid-display-box">
        <span style="color:#888;font-size:14px;">🆔</span>
        <input type="text" id="uidInput" placeholder="UID বসবে এখানে..." readonly>
        <button onclick="copyUidFromInput()" class="btn-sm">📋 কপি</button>
        <button onclick="openUidInFacebook()" class="btn-sm" style="background:#25a35a;">🌐 FB</button>
        <button onclick="clearUidInput()" class="btn-sm outline">✖</button>
    </div>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Search নাম, UID বা পাসওয়ার্ড..." oninput="searchUid()">
    </div>
    
    <div class="upload-area">
        <input type="file" id="uidFile" accept=".txt,.json,.csv">
        <div class="btn-group">
            <button onclick="uploadFile()" class="btn btn-green">📤 ফাইল আপলোড</button>
            <button onclick="openImportModal()" class="btn">📥 ইমপোর্ট</button>
            <button onclick="exportUids()" class="btn btn-outline">📥 ডাউনলোড</button>
            <button onclick="deleteAllUids()" class="btn btn-red">🗑️ সব ডিলিট</button>
        </div>
    </div>
    
    <div class="stats">
        <span>📊 মোট: <strong id="totalUID">0</strong></span>
        <span>✅ ইমপোর্টেড: <strong id="loadedUID">0</strong></span>
        <span>⏳ পেন্ডিং: <strong id="pendingUID">0</strong></span>
    </div>
    
    <div id="uidCardContainer"></div>
    <p class="click-hint">💡 কার্ডে ক্লিক করলে UID বক্সে বসবে | 🌐 Facebook এ ওপেন করতে UID তে ক্লিক করুন</p>
</div>

<div id="toast" class="toast"></div>

<!-- Detail Modal -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>👤 ডিটেইলস</h2>
            <span class="close" onclick="closeDetailModal()">&times;</span>
        </div>
        <div class="modal-body" id="detailBody">
            <div class="detail-row"><span class="label">নাম</span><span class="value" id="detailName">--</span></div>
            <div class="detail-row"><span class="label">UID</span><span class="value" id="detailUid">--</span></div>
            <div class="detail-row"><span class="label">পাসওয়ার্ড</span><span class="value" id="detailPass">--</span></div>
            <div class="detail-row"><span class="label">স্ট্যাটাস</span><span class="value" id="detailStatus">--</span></div>
        </div>
        <div class="modal-footer">
            <button onclick="copyDetailUid()" class="btn">📋 কপি UID</button>
            <button onclick="copyDetailPass()" class="btn btn-green">🔑 কপি পাস</button>
            <button onclick="openDetailInFb()" class="btn" style="background:#25a35a;">🌐 FB</button>
            <button onclick="deleteDetailUid()" class="btn btn-red">🗑️ ডিলিট</button>
            <button onclick="closeDetailModal()" class="btn btn-outline">বন্ধ</button>
        </div>
    </div>
</div>

<!-- Import Modal -->
<div id="importModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>📥 UID ইমপোর্ট</h2>
            <span class="close" onclick="closeImportModal()">&times;</span>
        </div>
        <div class="modal-body">
            <p style="text-align:center;color:#888;margin-bottom:10px;">ইমপোর্ট চলছে...</p>
            <div class="progress-container"><div class="progress-bar" id="importProgress"></div></div>
            <div style="display:flex;justify-content:space-between;color:#888;font-size:13px;">
                <span id="progressText">0%</span>
                <span id="estimatedTime">--</span>
            </div>
            <div id="importStatus" style="text-align:center;padding:8px;border-radius:8px;margin-top:10px;background:#1a1a2e;color:#f0a030;">🟡 প্রস্তুত...</div>
        </div>
        <div class="modal-footer">
            <button onclick="startImport()" class="btn">🚀 শুরু</button>
            <button onclick="closeImportModal()" class="btn btn-outline">বাতিল</button>
        </div>
    </div>
</div>

<script>
let uidList = [];
let passList = [];
let nameList = [];
let importedCount = 0;
let isImporting = false;

function showToast(msg, isError = false) {
    let t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

// ===== UID ইনপুট ফাংশন =====
function setUidInput(uid) {
    document.getElementById('uidInput').value = uid;
}

function copyUidFromInput() {
    let val = document.getElementById('uidInput').value;
    if (!val) { showToast('⚠️ কিছুই নেই!', true); return; }
    navigator.clipboard.writeText(val).then(() => {
        showToast('✅ UID কপি হয়েছে!');
    });
}

function clearUidInput() {
    document.getElementById('uidInput').value = '';
}

// ===== Facebook এ ওপেন =====
function openUidInFacebook() {
    let uid = document.getElementById('uidInput').value;
    if (!uid) { showToast('⚠️ কোন UID নেই!', true); return; }
    window.open('https://facebook.com/' + uid, '_blank');
    showToast('🌐 Facebook ওপেন হচ্ছে...');
}

function openUidDirect(uid) {
    if (!uid) return;
    window.open('https://facebook.com/' + uid, '_blank');
}

// ===== কার্ডে ক্লিক =====
function onCardClick(index) {
    let uid = uidList[index];
    setUidInput(uid);
    showToast('✅ UID বসেছে: ' + uid);
}

// ===== ডিলিট ফাংশন =====
function deleteUid(index) {
    if (!confirm('#' + (index+1) + ' ডিলিট করবেন?')) return;
    uidList.splice(index, 1);
    passList.splice(index, 1);
    nameList.splice(index, 1);
    if (importedCount > index) importedCount--;
    renderCards();
    updateStats();
    showToast('🗑️ ডিলিট হয়েছে!');
}

function deleteAllUids() {
    if (uidList.length === 0) { showToast('⚠️ কিছুই নেই!', true); return; }
    if (!confirm('সব UID ডিলিট করবেন?')) return;
    uidList = [];
    passList = [];
    nameList = [];
    importedCount = 0;
    renderCards();
    updateStats();
    clearUidInput();
    showToast('🗑️ সব ডিলিট হয়েছে!');
}

function deleteDetailUid() {
    let index = window._detailIndex;
    closeDetailModal();
    deleteUid(index);
}

// ===== ফাইল আপলোড =====
function uploadFile() {
    let file = document.getElementById('uidFile').files[0];
    if (!file) { showToast('⚠️ ফাইল সিলেক্ট করুন!', true); return; }
    let reader = new FileReader();
    reader.onload = function(e) {
        let lines = e.target.result.split('\n').filter(l => l.trim() !== '');
        uidList = []; passList = []; nameList = [];
        lines.forEach(line => {
            let parts = line.split('|').map(p => p.trim());
            if (parts.length >= 2) {
                uidList.push(parts[0]);
                passList.push(parts[1] || '');
                nameList.push(parts[2] || 'UID #' + (uidList.length+1));
            } else if (parts.length === 1) {
                uidList.push(parts[0]);
                passList.push('');
                nameList.push('UID #' + uidList.length);
            }
        });
        if (uidList.length === 0) {
            showToast('⚠️ কোন UID পাওয়া যায়নি! ফরম্যাট: UID|পাস|নাম', true);
            return;
        }
        importedCount = 0;
        document.getElementById('totalUID').textContent = uidList.length;
        document.getElementById('loadedUID').textContent = '0';
        document.getElementById('pendingUID').textContent = uidList.length;
        renderCards();
        showToast('✅ ' + uidList.length + ' টি UID পাওয়া গেছে!');
    };
    reader.readAsText(file);
}

// ===== কার্ড রেন্ডার =====
function renderCards() {
    let container = document.getElementById('uidCardContainer');
    container.innerHTML = '';
    uidList.forEach((uid, index) => {
        let pass = passList[index] || '';
        let name = nameList[index] || 'UID #' + (index+1);
        let initial = name.charAt(0).toUpperCase() || 'U';
        let isImported = index < importedCount;
        
        let card = document.createElement('div');
        card.className = 'uid-card';
        card.dataset.index = index;
        card.innerHTML = `
            <div class="card-top">
                <div class="avatar">${initial}</div>
                <div class="card-name" onclick="onCardClick(${index})">
                    <div class="name">${name}</div>
                    <div class="uid" onclick="event.stopPropagation();openUidDirect('${uid}')">🌐 ${uid}</div>
                </div>
                <span class="status ${isImported ? 'imported' : 'pending'}">${isImported ? '✅' : '⏳'}</span>
            </div>
            <div class="card-body" onclick="onCardClick(${index})">
                <div class="field">
                    <span class="label">🔑 পাস:</span>
                    <span class="value">${pass || '----'}</span>
                    ${pass ? `<button class="copy-btn" onclick="event.stopPropagation();copyText('${pass}','পাস')">📋</button>` : ''}
                </div>
                <div class="field">
                    <span class="label">🆔 UID:</span>
                    <span class="value">${uid}</span>
                    <button class="copy-btn" onclick="event.stopPropagation();copyText('${uid}','UID')">📋</button>
                </div>
            </div>
            <div class="card-status">
                <span>#${index+1}</span>
                <div class="card-actions">
                    <button onclick="event.stopPropagation();openDetail(${index})" class="btn-copy">👁️</button>
                    <button onclick="event.stopPropagation();openUidDirect('${uid}')" class="btn-copy" style="background:#25a35a;">🌐</button>
                    <button onclick="event.stopPropagation();deleteUid(${index})" class="btn-copy" style="background:#e74c3c;">🗑️</button>
                </div>
            </div>
        `;
        container.appendChild(card);
    });
    updateStats();
}

function updateStats() {
    document.getElementById('totalUID').textContent = uidList.length;
    document.getElementById('loadedUID').textContent = importedCount;
    document.getElementById('pendingUID').textContent = uidList.length - importedCount;
}

// ===== কপি =====
function copyText(text, label) {
    navigator.clipboard.writeText(text).then(() => {
        showToast('✅ ' + label + ' কপি হয়েছে!');
    }).catch(() => {
        let ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        showToast('✅ ' + label + ' কপি হয়েছে!');
    });
}

// ===== ডিটেইলস =====
function openDetail(index) {
    document.getElementById('detailName').textContent = nameList[index] || 'UID #' + (index+1);
    document.getElementById('detailUid').textContent = uidList[index];
    document.getElementById('detailPass').textContent = passList[index] || '----';
    document.getElementById('detailStatus').textContent = index < importedCount ? '✅ ইমপোর্টেড' : '⏳ পেন্ডিং';
    document.getElementById('detailModal').style.display = 'block';
    window._detailIndex = index;
}

function closeDetailModal() {
    document.getElementById('detailModal').style.display = 'none';
}

function copyDetailUid() {
    copyText(document.getElementById('detailUid').textContent, 'UID');
}

function copyDetailPass() {
    let pass = document.getElementById('detailPass').textContent;
    if (pass && pass !== '----') {
        copyText(pass, 'পাসওয়ার্ড');
    } else {
        showToast('⚠️ পাসওয়ার্ড নেই!', true);
    }
}

function openDetailInFb() {
    let uid = document.getElementById('detailUid').textContent;
    if (uid && uid !== '--') {
        openUidDirect(uid);
    } else {
        showToast('⚠️ কোন UID নেই!', true);
    }
}

// ===== সার্চ =====
function searchUid() {
    let q = document.getElementById('searchInput').value.toLowerCase();
    let cards = document.querySelectorAll('.uid-card');
    cards.forEach(card => {
        let text = card.textContent.toLowerCase();
        card.style.display = text.includes(q) ? 'block' : 'none';
    });
}

// ===== ইমপোর্ট =====
function openImportModal() {
    if (uidList.length === 0) { showToast('⚠️ আগে ফাইল আপলোড করুন!', true); return; }
    document.getElementById('importModal').style.display = 'block';
    document.getElementById('importProgress').style.width = '0%';
    document.getElementById('progressText').textContent = '0%';
    document.getElementById('estimatedTime').textContent = '--';
    document.getElementById('importStatus').textContent = '🟡 প্রস্তুত...';
    document.getElementById('importStatus').style.background = '#1a1a2e';
    document.getElementById('importStatus').style.color = '#f0a030';
}

function closeImportModal() {
    document.getElementById('importModal').style.display = 'none';
    isImporting = false;
}

function startImport() {
    if (isImporting) return;
    if (uidList.length === 0) { showToast('⚠️ কোন UID নেই!', true); return; }
    importedCount = 0;
    isImporting = true;
    document.getElementById('importStatus').textContent = '🟢 ইমপোর্ট চলছে...';
    document.getElementById('importStatus').style.background = '#0a2a1a';
    document.getElementById('importStatus').style.color = '#25a35a';
    simulateImport();
}

function simulateImport() {
    if (!isImporting) return;
    if (importedCount >= uidList.length) {
        document.getElementById('importStatus').textContent = '✅ সম্পূর্ণ!';
        document.getElementById('importStatus').style.background = '#0a2a1a';
        document.getElementById('importStatus').style.color = '#25a35a';
        document.getElementById('estimatedTime').textContent = 'সমাপ্ত!';
        document.getElementById('importProgress').style.width = '100%';
        document.getElementById('progressText').textContent = '100%';
        isImporting = false;
        renderCards();
        setTimeout(closeImportModal, 2000);
        showToast('🎉 সব UID ইমপোর্ট সম্পূর্ণ!');
        return;
    }
    let batch = Math.max(1, Math.floor(uidList.length / 80));
    importedCount = Math.min(importedCount + batch, uidList.length);
    let pct = Math.round((importedCount / uidList.length) * 100);
    document.getElementById('importProgress').style.width = pct + '%';
    document.getElementById('progressText').textContent = pct + '%';
    renderCards();
    setTimeout(simulateImport, 120);
}

function exportUids() {
    if (uidList.length === 0) { showToast('⚠️ কোন UID নেই!', true); return; }
    let text = uidList.map((uid, i) => {
        let pass = passList[i] || '';
        let name = nameList[i] || '';
        return [uid, pass, name].filter(Boolean).join(' | ');
    }).join('\n');
    let blob = new Blob([text], {type: 'text/plain'});
    let a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'uids.txt';
    a.click();
    showToast('✅ ডাউনলোড হয়েছে!');
}

window.onclick = function(e) {
    if (e.target === document.getElementById('detailModal')) closeDetailModal();
    if (e.target === document.getElementById('importModal')) closeImportModal();
}
</script>
